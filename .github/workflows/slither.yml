name: Slither

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  slither:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/slither-requirements.txt

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.3.1
        with:
          version: v1.3.1

      - name: Install Slither
        run: python -m pip install --requirement .github/slither-requirements.txt

      - name: Build contracts
        run: forge build --build-info

      - name: Analyze contracts
        run: slither . --fail-pedantic
