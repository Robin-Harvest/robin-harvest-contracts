[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.25"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./deployments" }]

fuzz = { runs = 256, seed = "0x726f62696e2d68617276657374" }
invariant = { runs = 256, depth = 64, fail_on_revert = true }

[profile.ci]
fuzz = { runs = 1000, seed = "0x726f62696e2d68617276657374" }
invariant = { runs = 500, depth = 128, fail_on_revert = true }

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[etherscan]
robinhood = { key = "${ROBINHOOD_EXPLORER_API_KEY}", url = "${ROBINHOOD_EXPLORER_API_URL}" }
